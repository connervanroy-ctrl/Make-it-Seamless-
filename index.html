<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make it seamlessly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Golos+Text:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout volgens het Figma-baseplan: wit, zwart, grijze vlakken, Golos Text. Eén scherm per stap. */
:root{
  --bg:#ffffff;
  --ink:#000000;
  --grey:#d9d9d9;
  --soft:#f0f0f0;
  --muted:#555555;
  --font:"Golos Text", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.screen{display:none;min-height:100%}
.screen.on{display:block}
.page{max-width:1320px;margin:0 auto;padding:40px 32px 80px}
@media (max-width:760px){.page{padding:22px 16px 60px}}
.back{background:none;border:0;padding:8px 0;font-size:17px;display:inline-flex;gap:8px;align-items:center;color:var(--ink)}
.back:hover{text-decoration:underline;text-underline-offset:4px}
h1,h2,h3{font-weight:500;margin:0;text-wrap:balance}

/* stiksel dat rondloopt bij hover (treintje) */
.stitch{position:relative;background:none;border:0}
.stitch::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(90deg,#000 50%,transparent 50%),linear-gradient(90deg,#000 50%,transparent 50%),linear-gradient(0deg,#000 50%,transparent 50%),linear-gradient(0deg,#000 50%,transparent 50%);
  background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;background-size:14px 2px,14px 2px,2px 14px,2px 14px;background-position:0 0,0 100%,0 0,100% 0;opacity:0;transition:opacity .2s}
.stitch:hover::after,.stitch:focus-visible::after{opacity:1;animation:treintje .5s linear infinite}
@keyframes treintje{to{background-position:14px 0,-14px 100%,0 -14px,100% 14px}}

/* ---------- 1. Start ---------- */
#start .center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(40px,8vh,110px);padding:24px;text-align:center}
#start h1{font-size:clamp(46px,8.4vw,126px);line-height:1.05;letter-spacing:-.01em}
.startbtn{font-size:clamp(34px,4.7vw,70px);padding:10px 34px;letter-spacing:.02em}

/* ---------- 3. Categorie scrollen ---------- */
.cat-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px 24px;margin:12px 0 36px}
.cat-head h1{font-size:clamp(40px,5.5vw,76px)}
.cat-head p{margin:0;color:var(--muted);font-size:17px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 52px}
@media (max-width:1000px){.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 28px}}
@media (max-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.card .ph{position:relative;aspect-ratio:214/294;background:var(--grey);overflow:hidden}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12px;mix-blend-mode:multiply;transition:transform .35s ease}
.card:hover .ph img{transform:scale(1.04)}
.card .t{font-size:16px;line-height:1.35}
.card .badge{position:absolute;left:10px;top:10px;background:var(--ink);color:#fff;font-size:12px;padding:4px 8px;font-weight:500}

/* ---------- 4. Het gekozen stuk ---------- */
.piece{display:grid;grid-template-columns:minmax(0,504fr) minmax(0,424fr) minmax(0,285fr);gap:72px;align-items:start;margin-top:22px}
@media (max-width:1000px){.piece{grid-template-columns:1fr 1fr;gap:28px}}
@media (max-width:640px){.piece{grid-template-columns:1fr}}
.bigphoto{position:relative;aspect-ratio:504/718;background:var(--grey)}
.bigphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:22px;mix-blend-mode:multiply}
.desc{background:var(--grey);padding:30px 28px;margin-top:20px;display:flex;flex-direction:column;gap:14px}
.desc h1{font-size:clamp(28px,2.8vw,40px);line-height:1.12}
.desc .meta{font-size:14px;color:#333}
.desc p{margin:0;font-size:17px;line-height:1.6}
.desc .parts{display:flex;flex-wrap:wrap;gap:6px}
.desc .parts span{background:#fff;padding:4px 10px;font-size:13px}
.side{display:flex;flex-direction:column;justify-content:flex-end;min-height:100%}
.sticker{width:min(285px,100%);aspect-ratio:1;border-radius:50%;background:var(--grey);border:0;display:grid;place-items:center;font-size:clamp(26px,2.6vw,38px);line-height:1.15;transition:background-color .25s ease, color .25s ease, transform .4s ease;margin-top:auto}
.sticker span{transform:rotate(-11.4deg);display:block}
.sticker:hover,.sticker:focus-visible{background:var(--ink);color:#fff;transform:rotate(8deg)}
.sticker.stitch::after{border-radius:50%;inset:14px;background:none;border:2px dashed currentColor;opacity:.6}
.sticker.stitch:hover::after{animation:spin 6s linear infinite;opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:1000px){.side{grid-column:1/-1;align-items:center}.sticker{width:220px}}

/* ---------- 5. Opmeten ---------- */
.measure{display:grid;grid-template-columns:minmax(0,504fr) minmax(0,760fr);gap:64px;align-items:start;margin-top:22px}
@media (max-width:1000px){.measure{grid-template-columns:1fr;gap:32px}}
.cam{position:relative;width:100%;aspect-ratio:504/718;background:var(--grey);overflow:hidden}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#000}
.cam canvas{background:transparent}
.camstart{position:absolute;inset:0;border:0;background:transparent;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 16px 24px;text-align:center;gap:6px}
.camstart span{font-size:clamp(22px,2.4vw,32px);line-height:1.2}
.camstart small{font-size:15px;color:#333;border-bottom:1px solid #333}
.camstart:hover small{color:#000;border-color:#000}
.camstatus{position:absolute;left:12px;right:12px;top:12px;margin:0;background:#000;color:#fff;padding:10px 14px;font-size:15px;line-height:1.4;z-index:2}
.count{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(90px,14vw,180px);font-weight:600;color:#fff;text-shadow:0 0 18px rgba(0,0,0,.6);pointer-events:none;z-index:2}
.camctl{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.ctl{background:#fff;border:1px solid #000;padding:10px 14px;font-size:15px}
.ctl:hover{background:#000;color:#fff}
.sl label small{color:var(--muted);font-size:13px}
.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cam svg.over{position:absolute;inset:0;width:100%;height:100%}
.cam .camlabel{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:clamp(20px,2.4vw,30px);line-height:1.25;padding:0 16px}
.cam .camlabel small{display:block;font-size:14px;color:#333;margin-top:6px}
.cam.busy::after{content:"Ik neem je maten…";position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.75);font-size:24px}
.camnote{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.sliders{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.sl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.sl label{font-size:16px}
.sl output{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.sl input{grid-column:1/-1;width:100%;accent-color:#000}
.sl.flash output{animation:flash .9s ease}
@keyframes flash{0%{background:#000;color:#fff}100%{background:transparent}}
.msg{font-size:15px;line-height:1.5;margin:12px 0 0;padding:10px 12px;background:var(--soft)}
.msg:empty{display:none}
.patterns h2{font-size:clamp(26px,2.6vw,38px);margin-bottom:16px}
.patterns .sub{margin:-6px 0 18px;color:var(--muted);font-size:15px;line-height:1.5}
.ptiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 22px}
@media (max-width:640px){.ptiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}
.ptile{background:var(--grey);display:flex;flex-direction:column}
.ptile .art{aspect-ratio:235/190;background:var(--soft);background-image:linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px);background-size:10px 10px;display:grid;place-items:center;padding:8px}
.ptile .art svg{height:100%;width:auto;max-width:100%}
.fitg{transform-box:view-box;transform-origin:100px 128px;transition:transform .35s ease}
.ptile .cap{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.ptile .cap b{font-weight:500;font-size:15px}
.ptile .cap span{font-size:13px;color:#333;font-variant-numeric:tabular-nums}
.ptile .cap .size{font-size:15px;color:#000;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:24px;height:0;vertical-align:middle;margin-right:6px}
.next{margin-top:30px;font-size:clamp(22px,2.4vw,32px);padding:16px 26px;background:var(--ink);color:#fff;border:0;display:inline-flex;gap:12px;align-items:center}
.next:hover{background:#222}
.loading{display:flex;align-items:center;gap:12px;font-size:17px;padding:24px 0}
.spin{width:20px;height:20px;border:3px solid #ccc;border-top-color:#000;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}

/* ---------- 6. How-to ---------- */
.howtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,477px);gap:56px;align-items:start;margin-top:22px}
@media (max-width:900px){.howtop{grid-template-columns:1fr;gap:28px}}
.intro{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start}
@media (max-width:520px){.intro{grid-template-columns:100px 1fr}}
.intro .thumb{aspect-ratio:3/4;background:var(--grey);position:relative}
.intro .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px;mix-blend-mode:multiply}
.intro h1{font-size:clamp(30px,3.4vw,48px);line-height:1.08;margin-bottom:12px}
.intro p{margin:0 0 12px;font-size:16.5px;line-height:1.6}
.level{display:flex;align-items:center;gap:6px;font-size:15px;margin:0 0 14px}
.level svg{width:20px;height:20px}
.mymeasures{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mymeasures span{background:var(--soft);padding:5px 10px;font-size:13.5px}
.mats{background:var(--grey);padding:30px 30px 26px;min-height:380px}
.mats h2{font-size:30px;margin-bottom:18px}
.mats .fabric{background:#fff;padding:14px 16px;margin-bottom:16px;font-size:15px;line-height:1.45}
.mats .fabric b{font-size:34px;font-weight:600;display:block;line-height:1.1;margin:2px 0 4px}
.mats .fabric .fl{display:block;font-size:14px;color:var(--muted)}
/* polaroid rond het camerabeeld */
.pola{background:#fff;padding:14px 14px 0;box-shadow:0 2px 4px rgba(0,0,0,.12),0 14px 34px rgba(0,0,0,.2);transform:rotate(-1.2deg)}
.pola-cap{display:block;height:64px;line-height:64px;text-align:center;font-size:18px}
/* download */
.dlrow{margin-top:22px}
.dl{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #000;padding:13px 18px;font-size:17px}
.dl svg{width:22px;height:22px}
.dl:hover:not(:disabled){background:#000;color:#fff}
.dl:disabled{cursor:progress;opacity:.8}
.dl .spin{width:16px;height:16px;border-width:2px}
.dlmsg{margin:8px 0 0;font-size:14px;color:var(--muted);line-height:1.5}
.dlmsg:empty{display:none}
/* ronde knop naar het stappenplan, rechtsonder */
#meten .page{padding-bottom:230px}
.tohow{position:fixed;right:30px;bottom:30px;z-index:20;width:190px;height:190px;border-radius:50%;background:var(--grey);border:0;display:grid;place-items:center;font-size:22px;line-height:1.2;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:background-color .25s ease,color .25s ease,transform .4s ease}
.tohow span{display:block;transform:rotate(-11.4deg)}
.tohow b{font-weight:400}
.tohow::after{content:"";position:absolute;inset:13px;border-radius:50%;border:2px dashed currentColor;opacity:.5;pointer-events:none}
.tohow:hover,.tohow:focus-visible{background:#000;color:#fff;transform:rotate(8deg)}
.tohow:hover::after{opacity:1;animation:spin 6s linear infinite}
@media (max-width:640px){.tohow{width:128px;height:128px;font-size:15px;right:16px;bottom:16px}.tohow::after{inset:9px}#meten .page{padding-bottom:170px}}
.mats ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.mats li{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.4}
.mats li::before{content:"";width:16px;height:16px;border:2px solid #000;flex-shrink:0;margin-top:2px}
.embprev{margin-top:28px;background:var(--soft);padding:18px 18px 16px}
.embprev h3{font-size:20px;margin:0 0 12px}
.embprev p{margin:10px 0 0;font-size:15px;line-height:1.5}
.chartbox{background:#161616;padding:10px;display:flex;justify-content:center;overflow-x:auto}
.chartbox.light{background:#fff;padding:0}
.chartbox svg{max-width:100%;height:auto;max-height:420px}
.drawbox{background:#161616;display:flex;justify-content:center}
.drawbox svg{width:100%;max-width:340px;height:auto}
.threads{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px}
.threads li{display:flex;align-items:center;gap:7px}
.threads i{width:16px;height:16px;border:1px solid #000;flex-shrink:0}
.threads span{color:var(--muted)}
.embprev.haak{display:grid;grid-template-columns:minmax(0,200px) 1fr;gap:20px;align-items:center}
@media (max-width:520px){.embprev.haak{grid-template-columns:1fr}}
.hat svg{width:100%;height:auto;display:block}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0 0}
.nums div{background:#fff;padding:10px 12px}
.nums dt{font-size:13px;color:var(--muted)}
.nums dd{margin:2px 0 0;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.embbox{background:var(--grey);padding:36px clamp(18px,4vw,56px) 40px;margin-top:56px}
.embbox h2{font-size:clamp(28px,3vw,40px)}
.embhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.views{display:flex;border:1.5px solid #000}
.view{background:#fff;border:0;padding:10px 16px;font-size:15px}
.view.on{background:#000;color:#fff}
.threads .sym{font-weight:600;width:14px;text-align:center}
.haakgrid .hat{max-width:220px;margin-bottom:14px}
.emb-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:820px){.emb-grid{grid-template-columns:1fr}}
.emb-grid p{margin:0 0 12px;font-size:16.5px;line-height:1.6}
.emb-grid .small{font-size:14px;color:var(--muted)}
.emb-grid .threads{flex-direction:column;gap:10px;font-size:15.5px}
.chartbox.big svg{max-height:720px;width:100%}
.drawbox.big svg{max-width:460px}
.hat.big{max-width:340px}
.plan{background:var(--grey);padding:40px clamp(18px,4vw,56px) 48px;margin-top:56px}
.plan-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:22px}
.plan-head h2{font-size:clamp(28px,3vw,40px)}
.progress{display:flex;align-items:center;gap:12px;font-size:15px;font-variant-numeric:tabular-nums}
.bar{width:180px;height:8px;background:#fff}
.bar i{display:block;height:100%;background:#000;transition:width .3s ease}
.made{font-size:16.5px;line-height:1.65;max-width:72ch;margin:0 0 26px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.step{background:#fff;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:18px 20px;transition:opacity .2s}
.step .n{font-size:28px;font-weight:500;width:44px;font-variant-numeric:tabular-nums}
.step p{margin:0;font-size:17px;line-height:1.55}
.step .check{width:44px;height:44px;border:2px solid #000;background:#fff;display:grid;place-items:center;padding:0}
.step .check svg{width:24px;height:24px;opacity:0}
.step.done{opacity:.55}
.step.done .check{background:#000}
.step.done .check svg{opacity:1}
.step.done p{text-decoration:line-through;text-decoration-thickness:1px}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:30px}
.terms div{background:#fff;padding:14px 16px;font-size:14.5px;line-height:1.5}
.terms b{font-weight:600;display:block;margin-bottom:2px}
.finish{margin-top:30px;font-size:16px;line-height:1.6;max-width:72ch}
.auto{font-size:13.5px;color:var(--muted);margin:10px 0 0}

/* ================= Figma-ontwerp v2: crème achtergrond, lijntjespapier, polaroids, speldenkussens ================= */
:root{--bg:#f4f4e9;--font:"Google Sans Code","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--title:"JetBrains Mono","Google Sans Code",ui-monospace,Menlo,Consolas,monospace;--red:#ff0000}
h1,h2,h3{font-family:var(--title);font-weight:500}
.paper{background:#cdbb9f url(assets/papier.jpg) center top/cover no-repeat;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.onpaper{color:#fff;font-weight:500;text-shadow:0 1px 2px rgba(70,45,10,.45)}

/* 1. Start: QR-code naar Élodie */
#start .qrwrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:24px 0}
.qrtext{margin:110px 0 0;padding:0 16px 0 29px;font-size:clamp(17px,1.67vw,24px);line-height:1.7;max-width:420px}
.qr{width:min(804px,calc(100vh - 96px),52vw);aspect-ratio:1;background:var(--grey);border:0;padding:0;display:grid;place-items:center;font-family:var(--title);font-size:clamp(40px,7.9vw,113px);color:#000;transition:transform .3s ease}
.qr:hover,.qr:focus-visible{transform:scale(1.01)}
.qr.real{background:#fff;padding:3.5%}
.qr svg{width:100%;height:100%;display:block}
@media (max-width:760px){#start .qrwrap{grid-template-columns:1fr;justify-items:center;align-content:center;gap:22px}.qrtext{margin:0;padding:0 22px;max-width:none;text-align:center}.qr{width:min(86vw,calc(100vh - 220px))}}

/* 3. Resultaten: foto's in een wit kader */
.cat-head h1{font-size:clamp(40px,5.3vw,76px)}
.card .ph{background:#fff}
.card .ph img{mix-blend-mode:normal}

/* 4. Het stuk: polaroid + lijntjespapier + speldenkussen */
.piece{grid-template-columns:minmax(0,462fr) minmax(0,700fr);gap:48px;align-items:stretch;padding-right:46px}
@media (max-width:1000px){.piece{grid-template-columns:1fr;padding-right:0}}
.bigphoto{background:#fff;aspect-ratio:462/658;align-self:start}
.bigphoto img{inset:3.3% 6.1% auto 7.6%;width:86.3%;height:74.8%;padding:0;mix-blend-mode:normal}
.pieceside{display:flex;flex-direction:column;min-width:0;padding-top:9px}
.card4{min-height:0;aspect-ratio:700/461;padding:6.9% 5.4% 6% 9.4%;display:flex;flex-direction:column;gap:clamp(14px,2vw,26px)}
.card4 h1{font-size:clamp(26px,3.2vw,46px);line-height:1;color:#000}
.card4 p{margin:0;font-size:clamp(17px,1.9vw,27px);line-height:1.32}
@media (max-width:640px){.card4{aspect-ratio:auto}}
.pin{background:none;border:0;padding:0;display:block;line-height:0;transition:transform .35s ease;transform-origin:50% 62%}
.pin img{width:100%;height:auto;display:block}
.pin:hover,.pin:focus-visible{transform:rotate(-5deg) scale(1.05)}
.pin:active{transform:scale(.97)}
#makeBtn{width:min(336px,70%);margin:auto -46px 0 auto;align-self:flex-end}
@media (max-width:1000px){#makeBtn{margin:22px 0 0 auto}}

/* 5. Opmeten: patroondelen op vellen papier, speldenkussen naar het stappenplan */
.patterns h2{text-transform:uppercase;font-size:clamp(26px,2.6vw,37px)}
.ptiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px}
@media (max-width:640px){.ptiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ptile{background:none}
.ptile .art{aspect-ratio:179/257;background:#f1ede2 url(assets/vel.jpg) center/cover no-repeat;padding:10px}
.ptile .cap{padding:7px 2px 12px}

/* startscherm: Élodie houdt de QR-code omhoog */
.bordwrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,24px);padding-block:clamp(20px,4vh,48px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bordtitel{margin:0;font-size:clamp(40px,6.4vw,96px);line-height:1;letter-spacing:-.01em;text-align:center}
.bord{position:relative;width:min(1240px,100%,calc((100vh - 230px)*1.473));max-width:100%}
.bord>img{display:block;width:100%;height:auto}
.bord .qr{position:absolute;left:37.3%;top:18.2%;width:35.3%;height:auto;aspect-ratio:1;padding:0;background:#fff;transform:rotate(-2.3deg);font-size:clamp(20px,3vw,48px)}
.bord .qr:hover{transform:rotate(-2.3deg)}
.bord .qr.real{padding:1.2%}
#start .qrstatus{margin:0;max-width:560px;text-align:left}

/* ================= Telefoon volgens Figma (naaikamer, crème tekstvlak, Élodie linksonder) ================= */
#elodie{background:#2b2620;font-family:var(--font);color:#000}
.ph2{position:relative;max-width:520px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;background:#b9a68c url(img/naaikamer.jpg) center/cover no-repeat}
.ph2-box{position:absolute;left:5.5%;right:5.5%;top:calc(5.4% + env(safe-area-inset-top,0px));height:26.2%;min-height:170px;background:#f4f4e9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 22px;text-align:center;z-index:2}
.ph2-say{margin:0;font-size:clamp(15px,4.4vw,19px);line-height:1.45;font-weight:500;text-wrap:balance}
.ph2-hint:empty{display:none}
.ph2-hint{margin:12px 0 0;font-size:12.5px;color:#666;line-height:1.35}
.ph2-box .ph-link.bad::before{background:#e2231a}
.ph2-box .ph-link.bad{left:12px;text-align:center;line-height:1.35}
.ph2-box:has(.ph-link.bad:not([hidden])){padding-top:56px}
.ph2-box .ph-link{position:absolute;top:9px;right:11px;left:auto;bottom:auto;background:none;color:#555;font-size:11px;padding:0;letter-spacing:.02em}
.ph2-fig{position:absolute;left:-2.7%;bottom:-1.8%;width:80%;height:65%;z-index:1}
.ph2-fig img{position:absolute;left:0;bottom:0;max-width:100%;max-height:100%;object-fit:contain;object-position:left bottom;opacity:0;transform-origin:30% 100%;transition:opacity .12s}
.ph2-fig img.on{opacity:1;animation:elpop .35s cubic-bezier(.3,1.6,.5,1)}
.ph2-fig.talk img.on{animation:elbob .22s ease-in-out infinite alternate}
.ph2-ctl{position:absolute;right:6%;bottom:calc(5% + env(safe-area-inset-bottom,0px));z-index:3;display:flex;flex-direction:column;align-items:center;gap:12px;transition:bottom .25s}
#elodie.typing .ph2-ctl{bottom:calc(5% + 64px + env(safe-area-inset-bottom,0px))}
.ph2-mute{width:44px;height:44px;border-radius:50%;border:2px solid #000;background:#f4f4e9;color:#000;display:grid;place-items:center;padding:0}
.ph2-mute svg{width:20px;height:20px}
.ph2-start{background:#f4f4e9;color:#000;border:2px solid #000;padding:14px 26px;font:500 17px var(--font);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.ph2-mic{width:78px;height:78px;border-radius:50%;border:2px solid #000;background:#f4f4e9;color:#000;display:grid;place-items:center;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:background-color .2s,color .2s,transform .2s}
.ph2-mic svg{width:34px;height:34px}
.ph2-mic:active{transform:scale(.95)}
.ph2-mic.on{background:#000;color:#f4f4e9;animation:micred 1.2s ease-in-out infinite}
.ph2-mic.busy{opacity:.55}
@keyframes micred{0%,100%{box-shadow:0 0 0 0 rgba(226,35,26,.75),0 6px 18px rgba(0,0,0,.25)}50%{box-shadow:0 0 0 16px rgba(226,35,26,0),0 6px 18px rgba(0,0,0,.25)}}
.ph2-type{position:absolute;left:4%;right:4%;bottom:calc(4% + env(safe-area-inset-bottom,0px));z-index:3;display:flex;gap:8px}
.ph2-type input{flex:1;min-width:0;font:16px var(--font);padding:12px 13px;border:2px solid #000;background:#f4f4e9;color:#000;border-radius:0}
.ph2-type button{flex:none;border:0;background:#000;color:#f4f4e9;padding:0 18px;font:500 15px var(--font)}

/* 5. Opmeten: het camerabeeld zit in een vergulde spiegel */
.spiegel{position:relative;width:100%;max-width:470px;aspect-ratio:2058/3429;margin:0 auto}
.spiegel .cam{position:absolute;left:16%;right:16%;top:21.8%;bottom:13.6%;width:auto;aspect-ratio:auto;border-radius:50%;background:linear-gradient(165deg,#d6ddd9 0%,#aebcb7 38%,#c9d1cd 62%,#93a29d 100%)}
.spiegel .cam::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(118deg,transparent 28%,rgba(255,255,255,.28) 38%,transparent 50%,transparent 62%,rgba(255,255,255,.14) 68%,transparent 74%)}

.spiegel .camstart small{font-size:13.5px}
.spiegel-lijst{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;filter:drop-shadow(0 12px 18px rgba(60,40,20,.3))}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Eén patroondeel tekenen: snijlijn, stiklijn (gestippeld), draadrichting, stofvouw, inrimpelen, plooien */
function pieceSVG(libId){
  const p=LIB[libId]||LIB.rokbaan,g=p.grain||[100,95,100,195];
  let s=`<path d="${p.d}" fill="#fff" stroke="#111" stroke-width="2.4" stroke-linejoin="round"/>`;
  s+=`<g transform="translate(10 13) scale(.9)"><path d="${p.d}" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/><\/g>`;
  const ang=Math.atan2(g[3]-g[1],g[2]-g[0]),ah=(x,y,a)=>`M${x} ${y} l${(-8*Math.cos(a-0.45)).toFixed(1)} ${(-8*Math.sin(a-0.45)).toFixed(1)} M${x} ${y} l${(-8*Math.cos(a+0.45)).toFixed(1)} ${(-8*Math.sin(a+0.45)).toFixed(1)}`;
  s+=`<path d="M${g[0]} ${g[1]} L${g[2]} ${g[3]} ${ah(g[2],g[3],ang)} ${ah(g[0],g[1],ang+Math.PI)}" stroke="#1d6a55" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  if(p.fold)s+=`<path d="M30 ${p.fold[0]} L30 ${p.fold[1]}" stroke="#c0392b" stroke-width="3" stroke-dasharray="12 4 2 4"/>`;
  if(p.gather){const[x1,x2,y]=p.gather;let d=`M${x1} ${y}`;for(let x=x1;x<x2;x+=8)d+=` q4 -5 8 0`;s+=`<path d="${d}" stroke="#c0392b" stroke-width="1.6" fill="none"/>`}
  if(p.pleats)p.pleats.forEach(x=>{s+=`<path d="M${x} 40 L${x} 230" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 5"/><path d="M${x-6} 52 l6 -6 l6 6" stroke="#c0392b" stroke-width="1.4" fill="none"/>`});
  return `<svg viewBox="-6 -10 212 276" role="img" aria-label="Patroondeel ${esc(p.naam)}">${s}<\/svg>`;
}

/* Afmetingen (breedte × hoogte in cm, inclusief wat bewegingsruimte) van elk patroondeel voor een set maten */
function dims(lib,M){
  const L=M.lengte,b=M.borst,t=M.taille,h=M.heup,s=M.schouder,a=M.arm,k=M.hoofd,hals=b*.4;
  const R={
    voorpand:[b/4+2,L*.26],voorpand_punt:[b/4+2,L*.28],achterpand:[b/4+2,L*.26],zijpand:[b/8+1,L*.22],
    jasvoorpand:[b/4+6,L*.34],jurkvoorpand:[b/4+8,L*.55],
    rechtemouw:[b*.38,a],tweedeligemouw:[b*.3,a],klokmouw:[b*.5,a*.9],pofmouw:[b*.55,a*.35],hammouw:[b*.6,a],
    ronde_kraag:[hals/2+6,12],opstaande_kraag:[hals/2+1,4.5],matrozenkraag:[s,30],
    rokbaan:[h/4+6,L*.4],plooirok:[h*.9,L*.4],schortbaan:[h/2+10,L*.45],
    manchet:[b*.18+3,6],tailleband:[t+4,4],
    broekvoor:[h/4+1,L*.34],broekachter:[h/4+4,L*.36],klep:[h/4,18],
    plastron:[12,L*.24],zak:[14,16],capuchon:[k/2+2,k*.62],cape:[s*2.2,L*.35],sjerp:[12,90],
    kap:[k/6+1.5,k/4-.5],cirkel:[k/3+4,k/3+4],
    schoen_boven:[26,10],schoen_zool:[9,25],tas:[30,25],
    slip_voor:[h/4+3,24],slip_achter:[h/4+5,28],kruisstuk:[8,15]
  };
  const r=R[lib]||[30,40];
  return [Math.round(r[0]*2)/2,Math.round(r[1]*2)/2];
}
/* Tailleband van een slip is elastiek: korter dan de taille */
function dimsFor(lib,naam,M){if(lib==="cirkel"&&/baret/i.test(naam))return[Math.round(M.hoofd/2),Math.round(M.hoofd/2)];if(lib==="tailleband"&&/brede hoofdband/i.test(naam))return[M.hoofd+2,8];if(lib==="tailleband"&&/elastiek/i.test(naam))return[Math.round(M.taille*.9),4];if(lib==="tailleband"&&/hoofd/i.test(naam))return[M.hoofd+2,4];return dims(lib,M)}

/* Hoeveel stof je nodig hebt bij een stofbreedte van 140 cm (ruwe schatting) */
function fabricMeters(delen,M){
  let area=0;delen.forEach(([lib,naam,aantal])=>{const[w,h]=dimsFor(lib,naam,M);area+=(w+3)*(h+3)*aantal});
  return Math.max(.3,Math.ceil(area*1.2/140/10)/10);
}

/* Patroondeel tekenen op maat: de vorm schaalt mee met jouw afmetingen */
function pieceSVGfit(lib,sx,sy){
  const inner=pieceSVG(lib).replace(/^<svg[^>]*>/,"").replace(/<\/svg>$/,"");
  return `<svg viewBox="-6 -10 212 276" role="img" aria-label="Patroondeel ${esc(LIB[lib].naam)}"><g class="fitg" style="transform:scale(${sx.toFixed(3)},${sy.toFixed(3)})">${inner}<\/g><\/svg>`;
}

const SYMS=["×","o","+","/","*","−","#","=","%","@","~","^"];
function makeChart(key,bgKey){
  const d=CHART_DATA[key],keys=Object.keys(d.pal).filter(k=>k!==bgKey),pal={};
  keys.forEach((k,i)=>pal[k]={naam:d.pal[k][0],hex:d.pal[k][1],sym:SYMS[i%SYMS.length]});
  return{w:d.rows[0].length,h:d.rows.length,rows:d.rows,pal,bg:d.bg,bgname:d.bgname,bgKey};
}
const isSt=(c,ch)=>ch!=="."&&ch!==c.bgKey&&!!c.pal[ch];
function chartCounts(c){const n={};c.rows.forEach(r=>[...r].forEach(ch=>{if(isSt(c,ch))n[ch]=(n[ch]||0)+1}));return n}
function shade(hex,f){const v=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));return "#"+v.map(x=>Math.max(0,Math.min(255,Math.round(x*f)))).map(x=>x.toString(16).padStart(2,"0")).join("")}
const jit=(x,y)=>{const s=Math.sin(x*12.9898+y*78.233)*43758.5453;return s-Math.floor(s)};
const textOn=hex=>{const v=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));return(v[0]*.3+v[1]*.59+v[2]*.11)>150?"#000":"#fff"};

/* weergave 1: kruisjes op de stof */
function chartStitchSVG(c,cell){
  const W=c.w*cell,H=c.h*cell,m=cell*.2;let s=`<rect width="${W}" height="${H}" fill="${c.bg}"/>`;
  c.rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(!isSt(c,ch))return;const col=shade(c.pal[ch].hex,.88+jit(x,y)*.24),x0=x*cell,y0=y*cell;
    s+=`<path d="M${x0+m} ${y0+m}L${x0+cell-m} ${y0+cell-m}M${x0+cell-m} ${y0+m}L${x0+m} ${y0+cell-m}" stroke="${col}" stroke-width="${cell*.2}" stroke-linecap="round"/>`}));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Voorbeeld van het borduurwerk in kruisjes">${s}<\/svg>`;
}
/* weergave 2: telpatroon met genummerde rijen en kolommen; mode "sym" (tekens) of "run" (telnummers per kleurreeks) */
function runNumbers(row,isOn){const out=[];let n=0,prev=null;[...row].forEach((ch,i)=>{n=(ch===prev)?n+1:1;prev=ch;out.push(n)});return out}
function chartGridSVG(c,cell,mode){
  const M=cell*1.7,W=c.w*cell,H=c.h*cell,fs=cell*.55,step=cell>=13?1:5;let s=`<rect x="0" y="0" width="${W+2*M}" height="${H+2*M}" fill="#fff"/><g transform="translate(${M} ${M})">`;
  c.rows.forEach((r,y)=>{const runs=runNumbers(r);[...r].forEach((ch,x)=>{
    const on=isSt(c,ch),hex=on?c.pal[ch].hex:(mode==="run"?c.bg:"#fff");
    if(on||mode==="run")s+=`<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="${hex}"/>`;
    const t=mode==="run"?runs[x]:(on?c.pal[ch].sym:"");
    if(t!=="")s+=`<text x="${x*cell+cell/2}" y="${y*cell+cell*.7}" font-size="${mode==="run"?fs*.95:fs*1.15}" text-anchor="middle" fill="${textOn(hex)}" font-family="Golos Text, Arial, sans-serif">${t}<\/text>`;
  })});
  for(let x=0;x<=c.w;x++)s+=`<line x1="${x*cell}" y1="0" x2="${x*cell}" y2="${H}" stroke="${x%10===0?"#000":"#b8b8b8"}" stroke-width="${x%10===0?1.4:.5}"/>`;
  for(let y=0;y<=c.h;y++)s+=`<line x1="0" y1="${y*cell}" x2="${W}" y2="${y*cell}" stroke="${y%10===0?"#000":"#b8b8b8"}" stroke-width="${y%10===0?1.4:.5}"/>`;
  for(let x=0;x<c.w;x++)if((x+1)%step===0||x===0)[-.5,H/cell+.5].forEach(yy=>s+=`<text x="${x*cell+cell/2}" y="${yy*cell+fs*.4}" font-size="${fs}" text-anchor="middle" fill="#444" font-family="Golos Text, Arial, sans-serif">${x+1}<\/text>`);
  for(let y=0;y<c.h;y++)if((y+1)%step===0||y===0)[-M/2,W+M/2].forEach(xx=>s+=`<text x="${xx}" y="${y*cell+cell*.68}" font-size="${fs}" text-anchor="middle" fill="#444" font-family="Golos Text, Arial, sans-serif">${y+1}<\/text>`);
  return `<svg viewBox="0 0 ${W+2*M} ${H+2*M}" role="img" aria-label="Telpatroon">${s}<\/g><\/svg>`;
}
function chartLegend(c){const n=chartCounts(c);return Object.keys(c.pal).filter(k=>n[k]).map(k=>`<li><i style="background:${c.pal[k].hex}"><\/i><b class="sym">${c.pal[k].sym}<\/b>${c.pal[k].naam}<span>${n[k]} ${c.unit||"kruisjes"}<\/span><\/li>`).join("")}

/* Haakpatroon voor mutsje 22: telpatroon van 12 steken breed, zoveel toeren als je maat vraagt */
const HAAK_PAL={V:["Paars","#5b2a86"],D:["Blauwpaars","#3a2f8f"],M:["Lila","#9a4fb5"],R:["Rood","#c8102e"],O:["Oranje","#ef8a2b"]};
function haakRows(R){
  const rows=[];for(let r=0;r<R;r++){let row="";for(let x=0;x<24;x++){const k=r%16,w1=Math.round(1.5+1.5*Math.sin(2*Math.PI*x/12)),w2=Math.round(1.5+1.5*Math.sin(2*Math.PI*(x+6)/12));
    let ch="V";
    if(k>=1&&k<=4)ch=(k-1)>=w1?"R":"V";else if(k===5)ch="O";else if(k>=6&&k<=8)ch="D";else if(k===9)ch=x%3===0?"O":"R";
    else if(k>=10&&k<=13)ch=(k-10)>=w2?"M":"V";else if(k===15)ch=x%4===0?"O":"V";
    row+=ch}rows.push(row)}return rows;
}
function haak(Mm){
  let S=Math.max(72,Math.round(Mm.hoofd*.97*1.6/12)*12);
  const nInc=S/6,crownH=nInc/1.8,H=Mm.hoofd*.31,R=Math.max(10,Math.round((H-crownH)*1.8));
  const rows=haakRows(R),pal={};Object.entries(HAAK_PAL).forEach(([k,[n,h]],i)=>pal[k]={naam:n,hex:h,sym:SYMS[i]});
  const chart={w:24,h:R,rows,pal,bg:"#ffffff",bgname:"",bgKey:null,unit:"steken per herhaling"};
  const crownSt=3*nInc*(nInc+1),rep=S/12,cnt={};rows.forEach(r=>[...r].forEach(ch=>cnt[ch]=(cnt[ch]||0)+rep/2));cnt.V=(cnt.V||0)+crownSt;cnt.R=(cnt.R||0)+S;
  const tot=Object.values(cnt).reduce((a,b)=>a+b,0),gram=Math.round(S/1.6*(crownH+R/1.8)*.12);
  const wol=Object.keys(HAAK_PAL).filter(k=>cnt[k]).map(k=>({naam:HAAK_PAL[k][0],gram:Math.max(5,Math.round(gram*cnt[k]/tot/5)*5)}));
  const steps=[
    "Maak eerst een proeflapje: 16 vasten en 18 toeren moeten samen 10 × 10 cm zijn. Is je lapje groter, neem dan een dunnere naald.",
    "Begin bovenaan met paarse wol: haak 6 vasten in een magische ring.",
    `Meerder in elke toer 6 vasten, gelijk verdeeld over de toer, tot je ${S} steken hebt. Dat zijn ${nInc} toeren.`,
    `Haak daarna de ${R} toeren van het telpatroon in vasten. Elk vakje is één vaste. Herhaal de 12 steken van het patroon ${S/12} keer rond.`,
    "Lees het telpatroon toer per toer van boven naar onder. Het cijfer in een vakje telt hoeveel steken je na elkaar in die kleur haakt.",
    "Wissel van kleur in de laatste lus van de steek ervoor, en neem de draad die je niet gebruikt mee binnenin je steken (tapestry-haken).",
    `Haak de schulprand in rood: *sla 2 steken over, haak 5 stokjes in de volgende steek, sla 2 steken over, 1 vaste in de volgende* (${S/6} schulpen).`,
    "Werk alle draadjes weg en breng de muts met wat stoom in vorm."
  ];
  return{S,nInc,R,gram,wol,steps,chart};
}
function haakSVG(h){
  const top=24,bottom=170,cr=Math.min(70,(bottom-top)*h.nInc/(h.nInc+h.R)),bodyTop=top+cr,rowH=(bottom-bodyTop)/h.R,cw=120/48;
  let s=`<defs><clipPath id="hat"><path d="M40 ${bottom} L40 92 C 40 40, 70 ${top}, 100 ${top} C 130 ${top}, 160 40, 160 92 L160 ${bottom} Z"/><\/clipPath><\/defs><g clip-path="url(#hat)"><rect x="30" y="${top}" width="140" height="${bottom-top}" fill="${HAAK_PAL.V[1]}"/>`;
  h.chart.rows.forEach((r,y)=>{for(let x=0;x<48;x++){const ch=r[x%24];if(ch!=="V")s+=`<rect x="${(40+x*cw).toFixed(2)}" y="${(bodyTop+y*rowH).toFixed(2)}" width="${(cw+.3).toFixed(2)}" height="${(rowH+.3).toFixed(2)}" fill="${HAAK_PAL[ch][1]}"/>`}});
  s+=`<\/g>`;
  const n=Math.min(10,Math.max(6,Math.round(h.S/12)));
  for(let i=0;i<n;i++){const x=40+i*120/n;s+=`<path d="M${x.toFixed(1)} ${bottom} Q ${(x+60/n).toFixed(1)} ${bottom+16} ${(x+120/n).toFixed(1)} ${bottom} Z" fill="${HAAK_PAL.R[1]}"/>`}
  s+=`<path d="M40 ${bottom} L40 92 C 40 40, 70 ${top}, 100 ${top} C 130 ${top}, 160 40, 160 92 L160 ${bottom}" fill="none" stroke="#000" stroke-width="1.5"/>`;
  return `<svg viewBox="20 10 160 190" role="img" aria-label="Het gehaakte mutsje met jouw telpatroon">${s}<\/svg>`;
}

const pending={};
function basisPatroon(it){

  else if(t.includes("hoeden"))delen=[["kap","Kap",has("klok")?6:4,"naai de banen aan elkaar"],["tailleband","Hoofdband",1,"op je hoofdomtrek"]];
  else if(t.includes("schorten"))delen=[["schortbaan","Schortbaan",1,""],["tailleband","Tailleband met koorden",1,""]].concat(has("zak")?[["zak","Opgestikte zak",1,""]]:[]).concat(has("mouw")?[["voorpand","Lijfje",1,""],[mouw,"Mouw",2,""]]:[]);
  else if(t.includes("tassen"))delen=[["tas","Voor- en achterkant",2,""],["klep","Klep",1,""],["sjerp","Schouderband",1,""]];
  else if(t.includes("schoenen"))delen=[["schoen_boven","Bovenstuk",2,"in leer of stevige stof"],["schoen_zool","Zool",2,""]];
  else if(t.includes("jurken"))delen=[["jurkvoorpand","Voorpand",1,"op de stofvouw"],["jurkvoorpand","Achterpand",2,"sluiting midden achter"]].concat(zonder?[]:[[mouw,"Mouw",2,""]]).concat(kraag?[kraag]:[]).concat(has("plooi")?[["plooirok","Plooirok (baan)",2,""]]:[]);
  else if(t.includes("jassen"))delen=has("cape")?[["cape","Cape",1,"op de stofvouw"]].concat(has("capuchon")?[["capuchon","Capuchon",2,""]]:[]):[["jasvoorpand","Voorpand",2,""],["achterpand","Achterpand",1,"op de stofvouw"]].concat(zonder?[]:[["tweedeligemouw","Bovenmouw",2,""],["rechtemouw","Ondermouw",2,""]]).concat(kraag?[kraag]:[]).concat(has("manchet")?[["manchet","Manchet",2,""]]:[]);
  else delen=[["voorpand","Voorpand",1,"op de stofvouw"],["achterpand","Achterpand",1,"op de stofvouw"]].concat(zonder?[]:[[mouw,"Mouw",2,""]]).concat(kraag?[kraag]:[]).concat(has("manchet")?[["manchet","Manchet",2,""]]:[]);
  const knopen=t.includes("knopen"),rits=t.includes("rits"),kant=t.includes("kant"),bord=t.includes("borduursel");
  return {niveau:delen.length>5?3:delen.length>3?2:1,delen,

    stappen:["Maak eerst een proefmodel in goedkope stof en pas het aan.","Knip alle delen uit je stof, let op de draadrichting.","Stik de grote delen aan elkaar en strijk de naden open.",delen.some(x=>/mouw/.test(x[0]))?"Zet de mouwen in.":"Werk de randen af met een zoom of bies.",kraag?"Zet de kraag op.":"Werk de hals of bovenkant af.",knopen?"Maak de knoopsgaten en zet de knopen.":rits?"Zet de rits in.":"Werk de zoom af en strijk alles mooi."],
    termen:[["Draadrichting","De richting waarin de draden van de stof lopen; leg je patroondeel daarlangs."],["Naadwaarde","De extra stof langs de rand die je nodig hebt om te stikken."]]};
}
function buildAIPattern(it){
  if(!IN_CLAUDE){const p=basisPatroon(it);aiPatterns[it.id]=p;return Promise.resolve(p)}
  if(pending[it.id])return pending[it.id];
  pending[it.id]=(async()=>{
    const sample=await getSample(false);
    const prompt=`Je bent docent patroontekenen en kledingconstructie. Een modestudent wil dit stuk uit de studiecollectie van MoMu thuis zelf maken.

Stuk: ${it.title}
Beschrijving: ${it.desc}
Onderdelen: ${it.delen}

Kies de patroondelen uit deze lijst (gebruik exact de id): ${LIB_IDS.map(id=>`${id} (${LIB[id].naam})`).join(", ")}.
Is het geen genaaid stuk (bijvoorbeeld gehaakt of gebreid), geef dan de delen die het dichtst in de buurt komen als je het in stof zou naaien, en zeg dat in "gemaakt".

Antwoord met alleen JSON, zonder uitleg ervoor of erna, in eenvoudig Nederlands:
{"delen":[{"id":"<id uit de lijst>","naam":"naam van dit deel voor dit stuk","aantal":<hoe vaak knippen>,"noot":"korte opmerking, max 8 woorden"}],
"gemaakt":"3 tot 4 zinnen over hoe dit stuk waarschijnlijk gemaakt is",
"materiaal":["3 tot 6 materialen, zonder hoeveelheden voor de hoofdstof"],
"niveau":<1 beginner, 2 gemiddeld of 3 gevorderd>,
"stappen":["5 tot 7 korte stappen om het zelf te maken"],
"termen":[["vakterm","korte uitleg"]]}
Geef 2 tot 4 vaktermen. Verzin geen jaartallen of namen.`;
    const res=await sample(prompt,{modelTier:"default"});
    const d=parseJSON(res.text);
    const p={auto:true,niveau:Math.max(1,Math.min(3,+d.niveau||2)),
      delen:(d.delen||[]).filter(x=>x&&LIB[x.id]).slice(0,9).map(x=>[x.id,String(x.naam||LIB[x.id].naam),Math.max(1,Math.min(8,+x.aantal||1)),String(x.noot||"")]),
      gemaakt:String(d.gemaakt||""),materiaal:(d.materiaal||[]).map(String).slice(0,7),stappen:(d.stappen||[]).map(String).slice(0,9),
      termen:(d.termen||[]).filter(Array.isArray).map(t=>[String(t[0]),String(t[1]||"")]).slice(0,5)};
    if(!p.delen.length)throw{message:"geen patroondelen"};
    aiPatterns[it.id]=p;return p;
  })();
  pending[it.id].catch(()=>{delete pending[it.id]});
  return pending[it.id];
}

    const opts=d=>({baseOptions:{modelAssetPath:MP_MODEL,delegate:d},runningMode:mode,numPoses:1,outputSegmentationMasks:true});
    let pose;try{pose=await m.PoseLandmarker.createFromOptions(fs,opts("GPU"))}catch(e){pose=await m.PoseLandmarker.createFromOptions(fs,opts("CPU"))}
    mp={pose,mode};

  return mp.pose;
}

let lastTs=0;
function loop(){
  cancelAnimationFrame(cam.raf);
  const v=document.getElementById("video"),cv=document.getElementById("overlay");
  if(!cam.stream||!v||!mp)return;
  const step=()=>{
    if(!cam.stream||cam.state==="klaar")return;
    if(v.readyState>=2&&v.videoWidth){
      const W=v.videoWidth,H=v.videoHeight;
      if(cv.width!==W){cv.width=W;cv.height=H}
      let ts=performance.now();if(ts<=lastTs)ts=lastTs+1;lastTs=ts;
      mp.pose.detectForVideo(v,ts,res=>onPose(res,W,H,cv));
    }
    cam.raf=requestAnimationFrame(step);
  };
  cam.raf=requestAnimationFrame(step);
}
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function onPose(res,W,H,cv){
  const ctx=cv.getContext("2d");ctx.clearRect(0,0,W,H);
  const lm=res.landmarks&&res.landmarks[0];
  if(!lm){status("Ik zie nog niemand. Ga voor de camera staan.");cam.okFrames=0;return}
  const mask=res.segmentationMasks&&res.segmentationMasks[0];
  const m=measureFrom(lm,mask?mask.getAsFloat32Array():null,mask?mask.width:0,mask?mask.height:0,W,H);
  /* skelet tekenen */
  ctx.lineWidth=Math.max(3,W/250);ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineCap="round";
  BONES.forEach(([a,b])=>{if((lm[a].visibility??1)>.4&&(lm[b].visibility??1)>.4){ctx.beginPath();ctx.moveTo(lm[a].x*W,lm[a].y*H);ctx.lineTo(lm[b].x*W,lm[b].y*H);ctx.stroke()}});
  ctx.fillStyle="#000";lm.forEach((p,i)=>{if(i>10&&i<29&&(p.visibility??1)>.4){ctx.beginPath();ctx.arc(p.x*W,p.y*H,ctx.lineWidth*1.3,0,7);ctx.fill()}});
  if(m.rows){ctx.setLineDash([12,8]);ctx.lineWidth=Math.max(2,W/400);ctx.strokeStyle="#000";m.rows.forEach(([y,x1,x2])=>{ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke()});ctx.setLineDash([])}
  if(!m.ok){status(m.reason);cam.okFrames=0;cam.samples=[];document.getElementById("camCount").hidden=true;if(cam.state==="tel")cam.state="zoek";return}
  cam.okFrames++;
  if(cam.state==="zoek"){status("Perfect, blijf zo staan…");if(cam.okFrames>12){cam.state="tel";cam.countStart=performance.now();cam.samples=[]}}
  if(cam.state==="tel"){
    cam.samples.push(m.maten);
    const left=3-Math.floor((performance.now()-cam.countStart)/1000),c=document.getElementById("camCount");
    if(left>0){c.hidden=false;c.textContent=left;status("Blijf stilstaan, ik meet…")}
    else{c.hidden=true;finishMeasure()}
  }
}
function median(a){a=a.filter(x=>x&&isFinite(x)).sort((p,q)=>p-q);return a.length?a[Math.floor(a.length/2)]:null}
function finishMeasure(){
  cam.state="klaar";cancelAnimationFrame(cam.raf);
  const keys=needed(curItem),got=[];
  ["borst","taille","heup","schouder","arm","hoofd"].forEach(k=>{const v=median(cam.samples.map(s=>s[k]));if(v){if(keys.includes(k)){setM(k,v,true);got.push(k)}else M[k]=Math.round(Math.max(MEASURES[k].min,Math.min(MEASURES[k].max,v))*2)/2}});
  store.set("maten",M);
  status("Gemeten! Kijk je maten na en schuif bij waar nodig.");setCtl();
  document.getElementById("camMsg").textContent=got.length?"":"Ik kon je maten niet goed zien. Probeer opnieuw met wat meer licht, of stel ze zelf in.";
}

/* Maten berekenen uit de lichaamspunten (genormaliseerd) en het silhouet (masker) */
function measureFrom(lm,mask,mw,mh,W,H){
  const vis=i=>lm[i]&&(lm[i].visibility??1)>.5;
  const P=i=>({x:lm[i].x*W,y:lm[i].y*H});
  if(![11,12,23,24].every(vis))return{ok:false,reason:"Ga recht voor de camera staan, met je gezicht naar me toe."};
  if(![27,28].every(vis)||Math.max(lm[27].y,lm[28].y)>.99)return{ok:false,reason:"Ga verder achteruit tot je van top tot teen in beeld staat."};
  const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  /* bovenkant van het hoofd: eerste rij van het silhouet boven de neus */
  let top=null;
  if(mask){const nx=Math.round(lm[0].x*mw),band=Math.round(mw*.06);
    for(let y=0;y<mh&&top==null;y++)for(let x=Math.max(0,nx-band);x<Math.min(mw,nx+band);x++)if(mask[y*mw+x]>.5){top=y/mh*H;break}}
  if(top==null)top=P(0).y-(P(24).y-P(12).y)*.3;
  if(top<H*.01)return{ok:false,reason:"Je hoofd valt net buiten beeld. Ga iets verder achteruit."};
  const feet=Math.max(...[27,28,29,30,31,32].filter(vis).map(i=>P(i).y));
  const px=feet-top;
  if(px<H*.45)return{ok:false,reason:"Kom iets dichterbij, je staat nog te klein in beeld."};
  const cm=M.lengte/px;
  const shY=(P(11).y+P(12).y)/2,hipY=(P(23).y+P(24).y)/2,cx=(P(23).x+P(24).x)/2,torso=hipY-shY;
  const rows=[];
  const widthAt=yPix=>{
    if(!mask)return null;const my=Math.round(yPix/H*mh),mx=Math.round(cx/W*mw);
    if(my<0||my>=mh||mask[my*mw+mx]<=.5)return null;
    let l=mx,r=mx;while(l>0&&mask[my*mw+l-1]>.5)l--;while(r<mw-1&&mask[my*mw+r+1]>.5)r++;
    rows.push([yPix,l/mw*W,(r+1)/mw*W]);return(r-l+1)/mw*W*cm;
  };
  const bw=widthAt(shY+torso*.28),tw=widthAt(shY+torso*.62),hw=widthAt(hipY+torso*.1);
  const arm=vis(13)&&vis(15)&&vis(14)&&vis(16)?((d(P(11),P(13))+d(P(13),P(15)))+(d(P(12),P(14))+d(P(14),P(16))))/2*cm*1.05:null;
  const head=vis(7)&&vis(8)?d(P(7),P(8))*cm*3.6:null;
  return{ok:true,rows,maten:{schouder:d(P(11),P(12))*cm*1.15,arm,borst:bw&&bw*2.7,taille:tw&&tw*2.75,heup:hw&&hw*2.7,hoofd:head}};
}

async function measurePhotoAI(small){

async function shrink(file){

/* Patroondelen op een groot vel leggen (in mm), rij per rij */
function layoutPieces(p){
  const GAP=15,pieces=p.delen.map(([lib,naam,aantal])=>{const[w,h]=dimsFor(lib,naam,M);return{lib,naam,aantal,w:w*10,h:h*10,wcm:w,hcm:h}});
  const maxW=Math.max(...pieces.map(x=>x.w));
  const cols=Math.max(2,Math.ceil((maxW+2*GAP)/190)),W=cols*190;
  const sorted=[...pieces].sort((a,b)=>b.h-a.h);
  let x=GAP,y=GAP,rowH=0;
  sorted.forEach(pc=>{if(x+pc.w+GAP>W){x=GAP;y+=rowH+GAP;rowH=0}pc.x=x;pc.y=y;x+=pc.w+GAP;rowH=Math.max(rowH,pc.h)});
  const H=y+rowH+GAP;

}
function drawPiece(ctx,pc,title){
  const L=LIB[pc.lib],b=pathBBox(L.d);
  const m=new DOMMatrix().translate(pc.x,pc.y).scale(pc.w/b.width,pc.h/b.height).translate(-b.x,-b.y);
  const base=new Path2D(L.d),out=new Path2D();out.addPath(base,m);
  const cx=b.x+b.width/2,cy=b.y+b.height/2;
  const mi=m.multiply(new DOMMatrix().translate(cx,cy).scale(.92).translate(-cx,-cy)),inner=new Path2D();inner.addPath(base,mi);
  ctx.fillStyle="#fff";ctx.fill(out);
  ctx.strokeStyle="#000";ctx.setLineDash([]);ctx.lineWidth=.6;ctx.stroke(out);
  ctx.setLineDash([3,2]);ctx.lineWidth=.3;ctx.stroke(inner);ctx.setLineDash([]);
  const T=(x,y)=>m.transformPoint(new DOMPoint(x,y));
  if(L.fold){const a=T(30,L.fold[0]),c=T(30,L.fold[1]);ctx.strokeStyle="#c0392b";ctx.lineWidth=.8;ctx.setLineDash([8,2,1,2]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(c.x,c.y);ctx.stroke();ctx.setLineDash([])}

  ctx.strokeStyle="#1d6a55";ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(g1.x,g1.y);ctx.lineTo(g2.x,g2.y);
  [[g2,ang],[g1,ang+Math.PI]].forEach(([q,a])=>{ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-5*Math.cos(a-.4),q.y-5*Math.sin(a-.4));ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-5*Math.cos(a+.4),q.y-5*Math.sin(a+.4))});ctx.stroke();
  /* label in het midden van het deel */
  const c=T(cx,cy),fs=Math.max(4,Math.min(9,pc.w/14));
  ctx.fillStyle="#000";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font=`600 ${fs}px "Golos Text", Arial, sans-serif`;ctx.fillText(pc.naam.toUpperCase(),c.x+fs*1.2,c.y-fs*1.4);
  ctx.font=`${fs*.7}px "Golos Text", Arial, sans-serif`;
  ctx.fillText(`Knip ${pc.aantal}x${L.fold&&pc.aantal===1?" op de stofvouw":""}`,c.x+fs*1.2,c.y);
  ctx.fillText(`${fmt(pc.wcm)} x ${fmt(pc.hcm)} cm`,c.x+fs*1.2,c.y+fs*1.1);
  ctx.font=`${fs*.55}px "Golos Text", Arial, sans-serif`;ctx.fillStyle="#555";ctx.fillText(title,c.x+fs*1.2,c.y+fs*2.1);
}

function chartCanvas(ch,cell){

/* Koppeling via een openbare MQTT-server (werkt ook op schoolwifi en mobiele data, zonder rechtstreekse verbinding tussen de toestellen). */
async function relayRoom(){
  await null;
  const code=ROLE==="scherm"?DESK_CODE:PAIR;if(!code)return null;
  try{if(typeof mqtt==="undefined")await loadScript("lib/mqtt.min.js")}catch(e){return null}
  if(typeof mqtt==="undefined")return null;
  const T=r=>"momu-elodie/v1/"+code+"/"+r,mine=T(ROLE),theirs=T(ROLE==="scherm"?"telefoon":"scherm");
  const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081/mqtt"];
  let client=null;
  for(const url of BROKERS){
    client=await new Promise(res=>{
      let c;try{c=mqtt.connect(url,{connectTimeout:6000,reconnectPeriod:0,clean:true,clientId:"momu_"+Math.random().toString(16).slice(2,12)})}catch(e){return res(null)}
      const t=setTimeout(()=>{try{c.end(true)}catch(e){}res(null)},7000);
      c.once("connect",()=>{clearTimeout(t);res(c)});
      c.once("error",()=>{clearTimeout(t);try{c.end(true)}catch(e){}res(null)});
    });
    if(client)break;
  }
  if(!client)return null;
  client.options.reconnectPeriod=2000;
  const self={},handlers=[];let other=null,otherAt=0;
  const snap=()=>[{sameTab:true,isMe:true,presence:{...self},updatedAt:Date.now()}].concat(other?[{sameTab:false,isMe:false,presence:other,updatedAt:otherAt}]:[]);
  const fire=()=>{const ps=snap();handlers.forEach(h=>{try{h({peers:ps,joined:[],left:[],updated:[]})}catch(e){}})};
  const send=()=>{try{client.publish(mine,JSON.stringify({t:Date.now(),p:self}),{retain:true,qos:0})}catch(e){}};
  client.on("message",(t,buf)=>{
    if(t!==theirs)return;let d=null;try{const txt=buf.toString();d=txt?JSON.parse(txt):null}catch(e){}
    if(d&&d.p&&typeof d.p==="object"){other=d.p;otherAt=Date.now()}else other=null;
    fire();
  });
  client.on("connect",()=>{client.subscribe(theirs);send()});
  client.subscribe(theirs);
  addEventListener("pagehide",()=>{try{client.publish(mine,"",{retain:true,qos:0})}catch(e){}});
  return {
    presence:async patch=>{for(const k in patch){if(patch[k]===null)delete self[k];else self[k]=patch[k]}fire();send()},
    onPeers:h=>{handlers.push(h);setTimeout(()=>h({peers:snap(),joined:[],left:[],updated:[]}),0);return()=>{}}
  };
}
async function peerRoom(){
  await null;
  try{if(typeof Peer!=="function")await loadScript("lib/peerjs.min.js")}catch(e){return null}
  if(typeof Peer!=="function")return null;
  const self={},others=new Map(),handlers=[],conns=new Set();
  const snap=()=>[{sameTab:true,isMe:true,presence:{...self},updatedAt:Date.now()},...others.values()];
  const fire=()=>{const ps=snap();handlers.forEach(h=>{try{h({peers:ps,joined:[],left:[],updated:[]})}catch(e){}})};
  const send=()=>conns.forEach(c=>{if(c.open)try{c.send({t:"p",p:{...self}})}catch(e){}});
  const ID=c=>"momu-elodie-"+c;
  const peer=new Peer(ROLE==="scherm"?ID(DESK_CODE):undefined,{debug:0});
  let dialTimer=0;
  function hook(c){
    conns.add(c);
    c.on("open",()=>{try{c.send({t:"p",p:{...self}})}catch(e){}});
    c.on("data",d=>{if(d&&d.t==="p"&&d.p&&typeof d.p==="object"){others.set(c.peer,{sameTab:false,isMe:false,presence:d.p,updatedAt:Date.now()});fire()}});
    const gone=()=>{if(!conns.has(c))return;conns.delete(c);others.delete(c.peer);fire();if(ROLE==="telefoon")redial()};
    c.on("close",gone);c.on("error",gone);
  }
  function dial(){if(!PAIR||peer.destroyed||[...conns].some(c=>c.open))return;hook(peer.connect(ID(PAIR),{reliable:true}))}
  function redial(){clearTimeout(dialTimer);dialTimer=setTimeout(dial,2000)}
  if(ROLE==="scherm")peer.on("connection",hook);
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
  const ok=await new Promise(res=>{
    const t=setTimeout(()=>res(false),15000);
    peer.on("open",()=>{clearTimeout(t);res(true)});
    peer.on("error",e=>{if(e&&e.type==="peer-unavailable"){redial();return}if(e&&e.type==="unavailable-id"){clearTimeout(t);res(false)}});
  });
  if(!ok)return null;
  if(ROLE==="telefoon")dial();
  return {
    presence:async patch=>{for(const k in patch){if(patch[k]===null)delete self[k];else self[k]=patch[k]}fire();send()},
    onPeers:(h,onErr)=>{handlers.push(h);setTimeout(()=>h({peers:snap(),joined:[],left:[],updated:[]}),0);return()=>{}}
  };
}
async function webSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  let rec=null,active=false;const st=[],pa=[],fi=[];
  const emit=(arr,v)=>arr.forEach(h=>{try{h(v)}catch(e){}});
  return {
    start(){
      if(active)return Promise.resolve();
      rec=new SR();rec.lang="nl-BE";rec.interimResults=true;rec.continuous=true;
      let reason=null;
      rec.onstart=()=>emit(st,{state:"listening"});
      rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)emit(fi,{text:" "+r[0].transcript.trim()});else interim+=r[0].transcript}emit(pa,{text:interim.trim()})};
      rec.onerror=e=>{reason=(e.error==="not-allowed"||e.error==="service-not-allowed")?"not_granted":e.error==="no-speech"?"stopped":"upstream_error"};
      rec.onend=()=>{active=false;emit(pa,{text:""});emit(st,{state:"idle",reason:reason||"stopped"})};
      active=true;emit(st,{state:"starting"});
      try{rec.start()}catch(e){active=false;emit(st,{state:"idle",reason:"upstream_error"});return Promise.reject({code:"upstream_error"})}
      return Promise.resolve();
    },
    stop(){if(rec&&active)try{rec.stop()}catch(e){}return Promise.resolve()},
    active:()=>active,
    onPartial:h=>{pa.push(h);return()=>{}},onFinal:h=>{fi.push(h);return()=>{}},onState:h=>{st.push(h);return()=>{}}
  };
}

const elIn=document.getElementById("elIn"),elSend=document.getElementById("elSend"),elForm=document.getElementById("elForm");
let dict=null,heard="",micOn=false;
function showType(on){elForm.hidden=!on;document.getElementById("elodie").classList.toggle("typing",on);document.getElementById("phAlt").hidden=on;if(on)elIn.focus({preventScroll:true})}
function micUI(state){
  micOn=state==="listening"||state==="starting";
  phMic.classList.toggle("on",micOn);phMic.classList.toggle("busy",state==="busy");
  phMic.setAttribute("aria-label",micOn?"Stop met praten":"Praat met Élodie");
  phHint.textContent=document.getElementById("elAsk").hidden?"Tik op Begin om te starten":state==="busy"?"Élodie zoekt…":micOn?"Ik luister… tik op de microfoon als je klaar bent":dict?"":"Tik op het microfoontje van je toetsenbord en spreek";
}
dictP.then(d=>{
  dict=d;
  if(!d){micUI("idle");return}
  d.onPartial(({text})=>{const t=(heard+" "+text).trim();phYou.textContent=t?"Jij: "+t:"";setPresence({zegt:t})});
  d.onFinal(({text})=>{heard=(heard+text).trim()+" ";phYou.textContent="Jij: "+heard.trim()});
  d.onState(({state,reason})=>{
    micUI(state);setPresence({status:state==="listening"?"luistert":"klaar"});
    if(state==="idle"){
      const q=heard.trim();heard="";
      if(q)elAsk(q);
      else if(reason==="not_granted"||reason==="unavailable"){dict=null;micUI("idle");showType(true)}
    }
  });
  micUI("idle");
});
phMic.addEventListener("click",()=>{
  if(phMic.classList.contains("busy"))return;
  if(!dict){showType(true);return}
  if(micOn){dict.stop().catch(()=>{});return}
  heard="";phYou.textContent="";elRun++;elAudio.pause();elStopBob();
  dict.start().catch(e=>{if(e&&(e.code==="not_granted"||e.code==="unavailable")){dict=null;micUI("idle");showType(true)}});
});
document.getElementById("phAlt").addEventListener("click",()=>showType(true));

document.getElementById("elStart").addEventListener("click",async e=>{
  e.currentTarget.hidden=true;document.getElementById("elAsk").hidden=false;micUI("idle");
  elStarted=true;try{sessionStorage.setItem("mis-gesprek","1")}catch(_){}
  setPresence({status:"klaar"});
  await elSpeak(EL_LINES.z1,"hey","z1");
  await elSpeak(EL_LINES.z2,"kijken","z2");
  await elSpeak(EL_LINES.z3,"praten","z3");
});
elForm.addEventListener("submit",e=>{e.preventDefault();elAsk(elIn.value)});

/* ---------- koppeling telefoon <-> groot scherm (via een gedeelde kamer) ---------- */
function setPresence(patch){if(pair)pair.presence(patch).catch(()=>{})}
const linkEl=document.getElementById("phLink");
function phoneSeesDesk(peers){
  const d=peers.filter(p=>!p.sameTab&&p.presence&&p.presence.rol==="scherm"&&(!PAIR||p.presence.code===PAIR)).sort((a,b)=>b.updatedAt-a.updatedAt)[0];
  deskHere=!!d;phoneDiag(deskHere?"ok":"zoekt");
  const sc=d&&typeof d.presence.scherm==="string"?d.presence.scherm:"";
  if(sc!==deskScherm){deskScherm=sc;
    const m=sc.match(/^#?(stuk|meten)-(\d\d)$/);
    if(m&&elStarted&&!phoneSaid.has(sc)){phoneSaid.add(sc);
      setTimeout(()=>{if(deskScherm===sc)elSpeak(m[1]==="stuk"?EL_LINES.z5:EL_LINES.z6,m[1]==="stuk"?"praten":"hey",m[1]==="stuk"?"z5":"z6")},m[1]==="stuk"?900:400)}
  }
}
const qrStatus=document.getElementById("qrStatus");
let seenVondst=null,deskStart=0;
function deskSeesPhone(peers,first){
  const ph=peers.filter(p=>!p.sameTab&&p.presence&&p.presence.rol==="telefoon"&&(!p.presence.code||p.presence.code===DESK_CODE)).sort((a,b)=>b.updatedAt-a.updatedAt)[0];
  qrStatus.hidden=false;
  if(!ph){qrStatus.textContent="Nog geen telefoon verbonden.";qrStatus.className="qrstatus";return}
  const zegt=typeof ph.presence.zegt==="string"?ph.presence.zegt.slice(0,200):"";
  const el=typeof ph.presence.elodie==="string"?ph.presence.elodie.slice(0,300):"";
  const st=ph.presence.status;
  qrStatus.className="qrstatus on";
  qrStatus.innerHTML=`<b>${st==="luistert"?"Élodie luistert…":st==="denkt"?"Élodie zoekt in de dozen…":"Telefoon verbonden"}</b>`
    +(zegt?`<span class="qs-me">Jij: “${esc(zegt)}”</span>`:"")+(el?`<span class="qs-el">Élodie: ${esc(el)}</span>`:"");
  const v=ph.presence.vondst;
  if(v&&typeof v.n==="number"&&Array.isArray(v.ids)){
    if(seenVondst===null&&first){seenVondst=v.n;return}
    if(v.n!==seenVondst&&v.n!==(seenVondst||0)){
      seenVondst=v.n;
      const ids=v.ids.map(String).filter(id=>BY_ID[id]).slice(0,6);
      if(ids.length){lastFind={q:String(v.q||"").slice(0,200),titel:String(v.titel||"Voor jou gevonden").slice(0,60),ids,antwoord:String(v.antwoord||"").slice(0,300)};
        try{sessionStorage.setItem("mis-vondst",JSON.stringify(lastFind))}catch(e){}
        if(location.hash==="#resultaten")route();else go("resultaten")}
    }
  }
}
const DESK_CODE=(()=>{const a="abcdefghjkmnpqrstuvwxyz23456789";let c="";for(let i=0;i<5;i++)c+=a[Math.floor(Math.random()*a.length)];return c})();
/* De koppeling loopt via de gedeelde kamer van dit artifact: elk toestel zet zijn rol en de koppelcode in zijn "presence". */
function phoneDiag(st,extra){
  if(ROLE!=="telefoon")return;
  linkEl.hidden=false;linkEl.classList.toggle("bad",st!=="ok");
  linkEl.textContent=st==="ok"?"Verbonden":st==="zoekt"?"Zoekt het grote scherm…":st==="geen"?(IN_CLAUDE?"Geen verbinding: open deze pagina terwijl je bij Claude bent ingelogd":"Geen verbinding met het grote scherm. Scan de code opnieuw."):"Geen verbinding ("+(extra||"onbekend")+")";
}
function deskDiag(text){qrStatus.hidden=false;qrStatus.className="qrstatus";qrStatus.textContent=text}
if(ROLE==="scherm"){
  const phoneUrl=ELODIE_BASE+"elodie-"+DESK_CODE;
  drawQR(phoneUrl);document.getElementById("qrTest").href=phoneUrl;
  roomP.then(async r=>{
    if(!r){deskDiag(IN_CLAUDE?"Dit scherm kan geen telefoon koppelen. Open deze pagina terwijl je bij Claude bent ingelogd.":"Dit scherm kan geen telefoon koppelen. Controleer de internetverbinding en herlaad de pagina.");return}
    pair=r;
    try{await r.presence({rol:"scherm",code:DESK_CODE,scherm:location.hash||"#start"})}catch(e){deskDiag("Dit scherm kan geen telefoon koppelen ("+(e&&e.code||"fout")+").");return}
    addEventListener("hashchange",()=>setPresence({scherm:location.hash||"#start"}));
    let first=true;
    r.onPeers(ch=>{deskSeesPhone(ch.peers,first);first=false},e=>deskDiag("Verbinding verbroken ("+(e&&e.code||"fout")+"). Herlaad de pagina."));
  });
}else{
  phoneDiag("zoekt");
  roomP.then(async r=>{
    if(!r){phoneDiag("geen");return}
    pair=r;
    try{await r.presence({rol:"telefoon",code:PAIR||"",status:elStarted?"klaar":"wacht"})}catch(e){phoneDiag("fout",e&&e.code);return}
    r.onPeers(ch=>phoneSeesDesk(ch.peers),e=>phoneDiag("fout",e&&e.code));
  });
}

/* zoeken: eerst Claude (als dat kan op dit toestel), anders een eigen zoeker op trefwoorden */
const elHistory=[];
const CATALOG=ITEMS.map(it=>`${it.id} | ${it.title} | ${it.tags.join(", ")} | ${it.delen} | ${it.desc}`).join("\n");
const EL_RULES=`Je bent Élodie, de persoonlijke naaister van MoMu, het ModeMuseum in Antwerpen: een warme, wat theatrale oudere Française die Nederlands spreekt met af en toe een Frans woordje (chérie, voilà, magnifique). Een bezoeker zegt op haar telefoon wat voor kledingstuk ze zoekt of wil maken. Kies uit de catalogus hieronder de stukken die het best passen: hoogstens 6, de beste eerst, alleen id's uit de lijst.

Antwoord met alleen JSON in deze vorm: {"antwoord": "...", "titel": "...", "ids": ["31", "11"]}
- antwoord: 1 à 2 korte zinnen in Élodies stem, hoogstens 35 woorden, zonder de titels op te sommen.
- titel: 2 à 4 woorden die samenvatten wat de bezoeker zoekt, bijvoorbeeld "Jassen met knopen".
- Is de vraag te vaag of past er niets: laat ids leeg en stel in antwoord één vriendelijke wedervraag.
- Gaat de vraag niet over kleding: laat ids leeg en breng het gesprek vriendelijk terug naar de collectie.

Catalogus (id | titel | kenmerken | onderdelen | beschrijving):
${CATALOG}`;
const SYN=[[/^(jas|jasje|jassen|vest|mantel|cape|jack|jak|uniform|blazer|manteltje)/,["jassen"]],[/^(jurk|kleed|japon)/,["jurken"]],[/^(muts|hoed|baret|pet|kap)/,["hoeden"]],[/^(broek|short)/,["broeken"]],[/^(schoen|laars|laarsje)/,["schoenen"]],[/^(tas|handtas)/,["tassen"]],[/^(bloes|blouse|hemd|top|lijfje)/,["bloezen"]],[/^(trui|pull|col)/,["truien"]],[/^(schort)/,["schorten"]],[/^(slip|onderbroek|ondergoed)/,["ondergoed"]],[/^(sieraad|broche|juweel)/,["sieraden"]],[/^(borduur|kruissteek|steek)/,["borduursel"]],[/^(knoop|knopen|knoopje)/,["knopen"]],[/^(kant|kantje|ruche)/,["kant"]],[/^(rits)/,["rits"]],[/^(streep|gestreept)/,["strepen"]],[/^(ruit|geruit|ruitje|dambord)/,["ruit"]],[/^(bloem|bloemetje|bloemen|roos|roosje)/,["bloemen"]],[/^(franje|kwast|pompon)/,["franjes"]],[/^(golf|golvend|krul|geschulpt)/,["golvend"]],[/^(hoek|hoekig|geometrisch|zigzag|vierkant)/,["hoekig"]],[/^(rond|cirkel|bol)/,["rond"]]];
const fold=t=>t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const STOP=new Set(["een","de","het","met","en","iets","ik","zoek","wil","graag","van","voor","op","in","mij","me","je","dat","die","wat","is","of","maken","heb","heeft"]);
function localFind(q){
  const words=fold(q).split(/[^a-z0-9]+/).filter(w=>w.length>2&&!STOP.has(w));
  const tags=new Set();words.forEach(w=>SYN.forEach(([re,t])=>{if(re.test(w))t.forEach(x=>tags.add(x))}));
  const scored=ITEMS.map(it=>{const title=fold(it.title),rest=fold(it.desc+" "+it.delen);let sc=0;
    it.tags.forEach(t=>{if(tags.has(t))sc+=3});
    words.forEach(w=>{const stem=w.replace(/(en|s|je|tje)$/,"");if(stem.length<3)return;if(title.includes(stem))sc+=2;else if(rest.includes(stem))sc+=1});
    return [it.id,sc]}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);
  const KIND=["jassen","jurken","hoeden","broeken","schoenen","tassen","bloezen","truien","schorten","ondergoed","sieraden"];
  const kind=KIND.find(k=>tags.has(k)),det=[...tags].filter(t=>!KIND.includes(t)).slice(0,2);
  const titel=kind?(kind==="hoeden"?"Mutsen en hoeden":kind)+(det.length?" met "+det.join(" en "):""):det.length?"Stukken met "+det.join(" en "):"Voor jou gevonden";
  return scored.length
    ?{ids:scored,titel:titel.charAt(0).toUpperCase()+titel.slice(1),antwoord:"Voilà, kijk eens wat ik in de dozen vond! Tik op een foto om het stuk van dichtbij te zien."}
    :{ids:[],titel:"",antwoord:"Hmm, daarvan vind ik niets in de dozen, chérie. Zoek je een jas, een jurk, een muts? Of iets met borduursel of knopen?"};
}
async function elFind(q){
  if(!aiOff){
    const sample=await samplePromise;
    if(sample){
      try{
        const turns=[{role:"user",content:EL_RULES},...elHistory.slice(-6),{role:"user",content:q}];
        const r=await sample.json(turns,{modelTier:"quick",cache:false});
        const ids=(Array.isArray(r&&r.ids)?r.ids:[]).map(String).filter(id=>BY_ID[id]).slice(0,6);
        if(r&&typeof r.antwoord==="string"&&r.antwoord.trim()){
          elHistory.push({role:"user",content:q},{role:"assistant",content:JSON.stringify({antwoord:r.antwoord,titel:r.titel||"",ids})});
          return {ids,titel:String(r.titel||"").trim()||q,antwoord:r.antwoord.trim()};
        }
      }catch(e){if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e&&e.code))aiOff=true}
    }
  }
  return localFind(q);
}
async function elAsk(q){
  q=(q||"").trim();if(!q||elBusy)return;
  elBusy=true;elSend.disabled=true;elIn.value="";micUI("busy");
  document.getElementById("elStart").hidden=true;document.getElementById("elAsk").hidden=false;

  setPresence({status:"denkt",zegt:q});
  elSpeak("Hmm… laat me even in de dozen kijken.","kijken");
  const r=await elFind(q);
  if(r.ids.length){
    lastFind={q,titel:r.titel,ids:r.ids,antwoord:r.antwoord};
    try{sessionStorage.setItem("mis-vondst",JSON.stringify(lastFind))}catch(e){}
    setPresence({status:"klaar",zegt:null,vondst:{n:Date.now(),q:q.slice(0,200),titel:r.titel.slice(0,60),ids:r.ids,antwoord:r.antwoord.slice(0,300)}});
    await elSpeak(EL_LINES.z4,"gevonden","z4");
    elSpeak(deskHere?"Kijk maar op het grote scherm, chérie. Tik daar op het stuk dat je wilt maken.":"Oh là là, ik vind het grote scherm niet, chérie. Scan de code op het scherm nog eens.","praten");
  }else{
    setPresence({status:"klaar",zegt:null});
    elSpeak(r.antwoord,"praten");
  }
  elBusy=false;elSend.disabled=false;micUI("idle");
}

route();
</script>
